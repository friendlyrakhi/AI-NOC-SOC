# Local hooks only: tools come from the uv/pnpm environments and a pinned gitleaks image,
# so pre-commit never downloads hook code. Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: eslint
        name: eslint (frontend)
        entry: pnpm --filter frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: >-
          docker run --rm -v .:/repo -w /repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --staged --no-banner --redact --config /repo/.gitleaks.toml /repo
        language: system
        pass_filenames: false
      - id: no-secrets-dir
        name: block files from infrastructure/secrets
        entry: files under infrastructure/secrets must never be committed
        language: fail
        files: ^infrastructure/secrets/(?!README\.md$)
