# uv workspace root (virtual: not itself a package).
[project]
name = "ai-noc-soc"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false
# Use the OS certificate store (needed behind TLS-inspecting antivirus or proxies).
system-certs = true

[tool.uv.workspace]
members = [
  "backend",
  "connectors/sdk",
  "connectors/catalog",
  "connectors/runner",
  "ai-engine/gateway",
  "automation/worker",
]

[tool.uv.sources]
nocsoc-api = { workspace = true }
nocsoc-connector-sdk = { workspace = true }
nocsoc-connectors = { workspace = true }
nocsoc-connector-runner = { workspace = true }
nocsoc-ai-gateway = { workspace = true }
nocsoc-workflow-worker = { workspace = true }

[dependency-groups]
dev = [
  "nocsoc-api",
  "nocsoc-connector-sdk",
  "nocsoc-connectors",
  "nocsoc-connector-runner",
  "nocsoc-ai-gateway",
  "nocsoc-workflow-worker",
  "pytest>=8",
  "testcontainers>=4.9",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6",
  "types-jsonschema>=4.23",
  "import-linter>=2.1",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "pre-commit>=4",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["app", "nocsoc_connector_sdk", "nocsoc_connectors", "connector_runner", "ai_gateway", "workflow_worker"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "PT018"]
"ai-engine/evals/**" = ["S101", "PT018"]
"backend/migrations/**" = ["E501"]
# SQL here is built only from module constants; all values are bound parameters (reviewed).
"backend/app/core/**" = ["S608"]
"backend/app/alerts/**" = ["S608"]
"backend/app/integrations/**" = ["S608"]
"backend/app/events.py" = ["S608"]
"backend/app/incidents/**" = ["S608"]
"backend/app/topology.py" = ["S608"]
"backend/app/ai/**" = ["S608"]
# Vendor-shaped sandbox payload literals read best on one line each.
"connectors/catalog/src/nocsoc_connectors/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["app", "nocsoc_connector_sdk", "nocsoc_connectors", "connector_runner", "ai_gateway", "workflow_worker"]

[[tool.mypy.overrides]]
# aiokafka ships no type information; it is confined to app.streaming, the ingest worker,
# migrate_stream and the runner's bus module.
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["backend/tests", "connectors/sdk/tests", "connectors/catalog/tests", "connectors/runner/tests", "ai-engine/gateway/tests", "ai-engine/evals", "tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["backend/tests", "ai-engine/evals"]
markers = ["integration: needs Docker (Postgres, Valkey; ingestion tests also Redpanda and ClickHouse)"]

# ---------- import-linter (module boundaries, NFR-10) ----------
[tool.importlinter]
root_packages = ["app", "nocsoc_connector_sdk", "nocsoc_connectors", "connector_runner", "ai_gateway", "workflow_worker"]

[[tool.importlinter.contracts]]
name = "Core does not depend on feature modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "AI gateway cannot reach action execution (AI-5, T21, LLM06)"
type = "forbidden"
source_modules = ["ai_gateway"]
forbidden_modules = ["workflow_worker", "connector_runner", "app", "nocsoc_connectors", "nocsoc_connector_sdk"]

[[tool.importlinter.contracts]]
name = "API AI module cannot reach executors or connectors (AI-5, LLM06)"
type = "forbidden"
source_modules = ["app.ai"]
forbidden_modules = [
  "app.integrations",
  "app.incidents.router",
  "app.ingestion",
  "app.workers",
  "nocsoc_connectors",  # the catalog: connector classes that can execute actions
  "connector_runner",
  "workflow_worker",
  "ai_gateway",
]
# nocsoc_connector_sdk is reachable only through app.events' record type models (no executor).

[[tool.importlinter.contracts]]
name = "Connector runner is a separate runtime (no platform internals)"
type = "forbidden"
source_modules = ["connector_runner"]
forbidden_modules = ["app", "ai_gateway", "workflow_worker"]

[[tool.importlinter.contracts]]
name = "Connectors depend only on the SDK"
type = "forbidden"
source_modules = ["nocsoc_connectors"]
forbidden_modules = ["app", "connector_runner", "ai_gateway", "workflow_worker"]

[[tool.importlinter.contracts]]
name = "Connector SDK is standalone"
type = "forbidden"
source_modules = ["nocsoc_connector_sdk"]
forbidden_modules = ["app", "nocsoc_connectors", "connector_runner", "ai_gateway", "workflow_worker"]

# ---------- bandit ----------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "evals"]
