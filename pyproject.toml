# uv workspace root (virtual: not itself a package).
[project]
name = "ai-noc-soc"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false
# Use the OS certificate store (needed behind TLS-inspecting antivirus or proxies).
system-certs = true

[tool.uv.workspace]
members = [
  "backend",
  "connectors/sdk",
  "connectors/runner",
  "ai-engine/gateway",
  "automation/worker",
]

[tool.uv.sources]
nocsoc-api = { workspace = true }
nocsoc-connector-sdk = { workspace = true }
nocsoc-connector-runner = { workspace = true }
nocsoc-ai-gateway = { workspace = true }
nocsoc-workflow-worker = { workspace = true }

[dependency-groups]
dev = [
  "nocsoc-api",
  "nocsoc-connector-sdk",
  "nocsoc-connector-runner",
  "nocsoc-ai-gateway",
  "nocsoc-workflow-worker",
  "pytest>=8",
  "testcontainers>=4.9",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "pre-commit>=4",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["app", "nocsoc_connector_sdk", "connector_runner", "ai_gateway", "workflow_worker"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"backend/migrations/**" = ["E501"]
# SQL here is built only from module constants; all values are bound parameters (reviewed).
"backend/app/core/**" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["app", "nocsoc_connector_sdk", "connector_runner", "ai_gateway", "workflow_worker"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["backend/tests", "connectors/sdk/tests", "tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["backend/tests"]
markers = ["integration: needs Docker (Postgres and Valkey containers)"]

# ---------- import-linter (module boundaries, NFR-10) ----------
[tool.importlinter]
root_packages = ["app", "nocsoc_connector_sdk", "connector_runner", "ai_gateway", "workflow_worker"]

[[tool.importlinter.contracts]]
name = "Core does not depend on feature modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "AI gateway cannot reach action execution (AI-5, T21, LLM06)"
type = "forbidden"
source_modules = ["ai_gateway"]
forbidden_modules = ["workflow_worker", "connector_runner"]

[[tool.importlinter.contracts]]
name = "Connector SDK is standalone"
type = "forbidden"
source_modules = ["nocsoc_connector_sdk"]
forbidden_modules = ["app", "connector_runner", "ai_gateway", "workflow_worker"]

# ---------- bandit ----------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
