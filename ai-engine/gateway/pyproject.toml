[project]
name = "nocsoc-ai-gateway"
version = "0.4.0"
description = "Model-agnostic AI gateway (P4): providers, redaction, structured output. No action execution."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "anthropic>=1.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]
