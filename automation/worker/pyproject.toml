[project]
name = "nocsoc-workflow-worker"
version = "0.5.0"
description = "Temporal workflow worker: playbooks, approvals and simulated action executors (P5)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nocsoc-connector-sdk",
  "nocsoc-connectors",
  "temporalio>=1.8",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_worker"]
