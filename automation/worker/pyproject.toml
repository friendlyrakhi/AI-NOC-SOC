[project]
name = "nocsoc-workflow-worker"
version = "0.1.0"
description = "Temporal workflow worker and simulated action executors (P5)"
requires-python = ">=3.12,<3.13"
dependencies = ["nocsoc-connector-sdk"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_worker"]
