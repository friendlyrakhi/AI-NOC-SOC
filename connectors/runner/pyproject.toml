[project]
name = "nocsoc-connector-runner"
version = "0.1.0"
description = "Connector runtime service (P2)"
requires-python = ">=3.12,<3.13"
dependencies = ["nocsoc-connector-sdk", "nocsoc-connectors", "aiokafka>=0.12", "httpx>=0.27", "pydantic-settings>=2.6"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connector_runner"]
