id: qualys.vmdr
name: Qualys VMDR
vendor: Qualys
category: vuln
version: 0.1.0
sdk: ">=1.0,<2.0"
certification: sandbox
docs_reference: "Qualys VM API v2: /api/2.0/fo/asset/host/vm/detection (host list detection)"
auth_types: [basic]
streams:
  - {name: detections, output: vuln_finding@1, default_interval_seconds: 3600}
  - {name: hosts, output: asset@1, default_interval_seconds: 3600}
webhook: false
actions: []
severity_map: {"5": critical, "4": high, "3": medium, "2": low, "1": info}
rate_limit_per_minute: 30
config_schema:
  type: object
  properties:
    platform_url: {type: string}
  additionalProperties: false
secrets_schema:
  type: object
  properties:
    username: {type: string}
    password: {type: string}
