[project]
name = "nocsoc-connectors"
version = "0.1.0"
description = "Sandbox-first connector catalog (docs/06-connector-sdk.md §8)"
requires-python = ">=3.12,<3.13"
dependencies = ["nocsoc-connector-sdk"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocsoc_connectors"]
