[project]
name = "nocsoc-connector-sdk"
version = "0.1.0"
description = "Connector SDK contract (docs/06-connector-sdk.md)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pyyaml>=6", "jsonschema>=4.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocsoc_connector_sdk"]
