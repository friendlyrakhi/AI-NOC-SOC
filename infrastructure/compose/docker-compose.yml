# Unified AI NOC & SOC platform: local development stack.
# Profiles (docs/02-architecture.md §7): core (P0-P1), stream + analytics (P2). Later phases
# add ai (P4), workflow (P5), search (P6), observability (P7). `tools` holds one-shot jobs.
#   stream:    Redpanda, ClickHouse, stream setup, ingest worker, connector runner
#   analytics: ClickHouse only (event search without ingestion)
#
# Rules (threat model T27/T30): every published port binds to 127.0.0.1, no privileged
# containers, no Docker socket mounts, secrets come from files and never from env values.
# scripts/check-compose.py enforces these in CI.
#
# Use scripts/dev.ps1 (or dev.sh) rather than calling compose directly.

name: nocsoc

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    profiles: [core]
    networks: [data]
    # pgvector 0.8.7 on PostgreSQL 17.12
    image: pgvector/pgvector@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nocsoc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${NOCSOC_PG_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - log_connections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nocsoc -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  valkey:
    <<: *hardening
    profiles: [core]
    networks: [data]
    # Valkey 8.1.11
    image: valkey/valkey@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    secrets: [valkey_password]
    # Password goes into a tmpfs config file, not the process arguments.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf 'requirepass %s\n' "$$(cat /run/secrets/valkey_password)" > /tmp/valkey.conf &&
        exec valkey-server /tmp/valkey.conf
        --maxmemory 256mb --maxmemory-policy allkeys-lru
        --save "" --appendonly no --protected-mode yes
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:${NOCSOC_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m

  mailpit:
    <<: *hardening
    profiles: [core]
    networks: [data]
    # Mailpit 1.33.1: dev email sink, nothing leaves the machine.
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:${NOCSOC_MAIL_UI_PORT:-8025}:8025"
      - "127.0.0.1:${NOCSOC_SMTP_PORT:-1025}:1025"
    mem_limit: 128m

  # One-shot: roles, extensions, Alembic migrations, permission catalog (app.db.migrate).
  # Also runs the dev seed via `scripts/dev seed`. Holds the superuser password; the API does not.
  migrate:
    <<: *hardening
    restart: "no"
    profiles: [core]
    networks: [data]
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      secrets: [build_extra_ca]
    image: nocsoc/api:dev
    command: ["python", "-m", "app.db.migrate"]
    environment:
      NOCSOC_ENVIRONMENT: dev
      NOCSOC_DATABASE_HOST: postgres
    secrets:
      - source: postgres_password
        target: nocsoc_postgres_password
      - source: database_password
        target: nocsoc_database_password
      - source: auth_database_password
        target: nocsoc_auth_database_password
      - source: worker_database_password
        target: nocsoc_worker_database_password
      - source: master_key
        target: nocsoc_master_key
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m

  api:
    <<: *hardening
    profiles: [core]
    networks: [data, bus, frontend, ai, workflow, search, telemetry]
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      secrets: [build_extra_ca]
    image: nocsoc/api:dev
    # P7 (NFR-1 load test): several worker processes; one Python process saturated one core at ~55 req/s.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header",
              "--workers", "${NOCSOC_API_WORKERS:-4}"]
    environment:
      NOCSOC_ENVIRONMENT: dev
      NOCSOC_EXECUTION_MODE: simulate
      NOCSOC_DATABASE_HOST: postgres
      NOCSOC_DATABASE_NAME: nocsoc
      NOCSOC_DATABASE_USER: nocsoc_app
      NOCSOC_VALKEY_HOST: valkey
      NOCSOC_SMTP_HOST: mailpit
      NOCSOC_WEB_BASE_URL: http://127.0.0.1:${NOCSOC_WEB_PORT:-3000}
      # Optional (stream/analytics profiles). Without them those features answer 503.
      NOCSOC_KAFKA_BOOTSTRAP: redpanda:9092
      NOCSOC_CLICKHOUSE_HOST: clickhouse
      # Optional (ai profile). Without it AI endpoints answer 503.
      NOCSOC_AI_GATEWAY_URL: http://ai-gateway:8200
      # Optional (workflow profile). Without it action requests and playbooks answer 503.
      NOCSOC_TEMPORAL_ADDRESS: temporal:7233
      # Optional (search profile). Without it global search uses Postgres and hunts answer 503.
      NOCSOC_OPENSEARCH_URL: http://opensearch:9200
      # Optional SSO (sso profile; scripts/dev sets NOCSOC_OIDC_ENABLED). Users must already exist.
      NOCSOC_OIDC_ENABLED: ${NOCSOC_OIDC_ENABLED:-false}
      NOCSOC_OIDC_DISPLAY_NAME: Keycloak (DEMO)
      NOCSOC_OIDC_ISSUER: http://127.0.0.1:${NOCSOC_KEYCLOAK_PORT:-8180}/realms/nocsoc
      NOCSOC_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/nocsoc/.well-known/openid-configuration
      NOCSOC_OIDC_IDP_ENFORCES_MFA: "true"
      # Observability profile (P7): OTLP to otel-lgtm when NOCSOC_OTEL_ENABLED=true (scripts/dev sets it).
      NOCSOC_OTEL_ENABLED: ${NOCSOC_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    # File names carry the settings prefix: pydantic-settings maps NOCSOC_<FIELD> to them.
    secrets:
      - source: ai_gateway_token
        target: nocsoc_ai_gateway_token
      - source: workflow_token
        target: nocsoc_workflow_token
      - source: database_password
        target: nocsoc_database_password
      - source: auth_database_password
        target: nocsoc_auth_database_password
      - source: valkey_password
        target: nocsoc_valkey_password
      - source: master_key
        target: nocsoc_master_key
      - source: runner_token
        target: nocsoc_runner_token
      - source: clickhouse_reader_password
        target: nocsoc_clickhouse_reader_password
      - source: opensearch_reader_password
        target: nocsoc_opensearch_reader_password
      - source: oidc_client_secret
        target: nocsoc_oidc_client_secret
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      opensearch-setup: { condition: service_completed_successfully, required: false }
    ports:
      - "127.0.0.1:${NOCSOC_API_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g

  # Audit anchors (P7, threat model T28): signs each audit chain's head into an append-only file
  # on a volume that only this service writes. Worker DB role; it can call audit_heads() and
  # audit_hash_at() but cannot read audit content. The API never sees the key or the volume.
  audit-anchor:
    <<: *hardening
    profiles: [core]
    networks: [data, telemetry]
    image: nocsoc/api:dev
    command: ["python", "-m", "app.workers.anchor"]
    environment:
      NOCSOC_DATABASE_HOST: postgres
      # Observability profile (P7): OTLP to otel-lgtm when NOCSOC_OTEL_ENABLED=true (scripts/dev sets it).
      NOCSOC_OTEL_ENABLED: ${NOCSOC_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    secrets:
      - source: worker_database_password
        target: nocsoc_worker_database_password
      - source: audit_anchor_key
        target: nocsoc_audit_anchor_key
    volumes:
      - auditanchors:/var/lib/nocsoc/anchors
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 128m

  # One-shot (scripts/verify-audit): recomputes every chain and checks it against the anchors.
  audit-verify:
    <<: *hardening
    restart: "no"
    profiles: [tools]
    networks: [data]
    image: nocsoc/api:dev
    command: ["python", "-m", "app.tools.verify_audit"]
    environment:
      NOCSOC_DATABASE_HOST: postgres
    secrets:
      - source: postgres_password
        target: nocsoc_postgres_password
      - source: audit_anchor_key
        target: nocsoc_audit_anchor_key
    volumes:
      - auditanchors:/var/lib/nocsoc/anchors:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 128m

  # Observability (P7, NFR-6): OpenTelemetry collector, Prometheus, Tempo, Loki and Grafana in one
  # container (grafana/otel-lgtm v0.41.0). Services send OTLP over the internal `telemetry`
  # network. Grafana is published on loopback only; anonymous visitors are Viewers, and the admin
  # password comes from a secret. Platform dashboards and SLO rules come from the repository.
  otel-lgtm:
    <<: *hardening
    profiles: [observability]
    networks: [telemetry]
    image: grafana/otel-lgtm@sha256:2e3290657f2f2a256c7a9175f097424a3ac5b54840741ace433e108e109348b6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    secrets: [grafana_admin_password]
    volumes:
      - lgtmdata:/data
      - ../observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ../observability/rules.yaml:/otel-lgtm/nocsoc-rules.yaml:ro
      - ../observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/nocsoc.yaml:ro
      - ../observability/dashboards:/otel-lgtm/nocsoc-dashboards:ro
    ports:
      - "127.0.0.1:${NOCSOC_GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health >/dev/null && curl -sf http://127.0.0.1:13133/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2g

  # Optional SSO (P7, D7): Keycloak 26.4 dev server with a DEMO realm (two users matching seeded
  # accounts, OTP required at first sign-in). The API validates its tokens; nobody is provisioned by it.
  # Secrets are read from files inside the container, never from compose environment values.
  keycloak:
    <<: *hardening
    profiles: [sso]
    networks: [frontend]
    image: quay.io/keycloak/keycloak@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    entrypoint:
      - bash
      - -c
      - >-
        export NOCSOC_OIDC_CLIENT_SECRET="$$(cat /run/secrets/oidc_client_secret)"
        NOCSOC_SSO_DEMO_PASSWORD="$$(cat /run/secrets/sso_demo_password)"
        KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)" &&
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_HOSTNAME: http://127.0.0.1:${NOCSOC_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    secrets: [oidc_client_secret, sso_demo_password, keycloak_admin_password]
    volumes:
      - ./keycloak/nocsoc-realm.json:/opt/keycloak/data/import/nocsoc-realm.json:ro
    ports:
      - "127.0.0.1:${NOCSOC_KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g

  ai-gateway:
    <<: *hardening
    profiles: [ai]
    networks: [ai]
    build:
      context: ../..
      dockerfile: infrastructure/docker/ai-gateway.Dockerfile
      secrets: [build_extra_ca]
    image: nocsoc/ai-gateway:dev
    environment:
      NOCSOC_AI_CLOUD_EGRESS_ENABLED: "false"
    # Only the shared API token. No data-store, bus or runner credentials (LLM06, T21).
    secrets:
      - source: ai_gateway_token
        target: nocsoc_ai_gateway_token
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    mem_limit: 256m

  temporal:
    <<: *hardening
    profiles: [workflow]
    networks: [workflow]
    # Temporal CLI dev server 1.4.1 with SQLite persistence (dev only; docs/reports/P5-exit-review.md)
    image: temporalio/temporal@sha256:9844298258519ebece82b3253f1ee1fc4eb8d87b7abcc264cfb676be342c74a5
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless", "--db-filename", "/home/temporal/temporal.db"]
    volumes:
      # Mounted on the image-owned home so a new volume inherits uid 1000 (temporal).
      - temporaldata:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m

  opensearch:
    <<: *hardening
    profiles: [search]
    networks: [search]
    # OpenSearch 3.8.0 single node, security plugin on (users and roles), HTTP inside the
    # internal network only. The admin password is read from its secret at start.
    image: opensearchproject/opensearch@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40
    entrypoint:
      - sh
      - -c
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD="$$(cat /run/secrets/opensearch_admin_password)" exec ./opensearch-docker-entrypoint.sh opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      plugins.security.ssl.http.enabled: "false"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      # Snapshot repository for backups (P7, scripts/backup.py), inside the data volume.
      path.repo: /usr/share/opensearch/data/snapshots
    secrets: [opensearch_admin_password]
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    cap_drop: [ALL]
    healthcheck:
      # 401 means the HTTP layer and the security plugin are up (anonymous access is refused).
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9200/)\" = 401 ]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1536m

  opensearch-setup:
    <<: *hardening
    restart: "no"
    profiles: [search]
    networks: [search]
    image: nocsoc/api:dev
    command: ["python", "-m", "app.db.migrate_search"]
    environment:
      NOCSOC_OPENSEARCH_URL: http://opensearch:9200
    # The only holder of the admin password besides OpenSearch itself.
    secrets:
      - source: opensearch_admin_password
        target: nocsoc_opensearch_admin_password
      - source: opensearch_reader_password
        target: nocsoc_opensearch_reader_password
      - source: opensearch_indexer_password
        target: nocsoc_opensearch_indexer_password
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      opensearch: { condition: service_healthy }
    mem_limit: 256m

  workflow-worker:
    <<: *hardening
    profiles: [workflow]
    networks: [workflow, telemetry]
    build:
      context: ../..
      dockerfile: infrastructure/docker/workflow-worker.Dockerfile
      secrets: [build_extra_ca]
    image: nocsoc/workflow-worker:dev
    environment:
      NOCSOC_API_URL: http://api:8000
      NOCSOC_TEMPORAL_ADDRESS: temporal:7233
      NOCSOC_OTEL_ENABLED: ${NOCSOC_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    # Only the workflow token: no database, bus, valkey or AI credentials.
    secrets:
      - source: workflow_token
        target: nocsoc_workflow_token
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      temporal: { condition: service_healthy }
      api: { condition: service_healthy }
    mem_limit: 256m

  web:
    <<: *hardening
    profiles: [core]
    networks: [frontend]
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      secrets: [build_extra_ca]
    image: nocsoc/web:dev
    environment:
      NOCSOC_API_INTERNAL_URL: http://api:8000
      # Local http on 127.0.0.1. Secure cookies + TLS arrive with the hardened profile (P7).
      NOCSOC_COOKIE_SECURE: "false"
    read_only: true
    tmpfs:
      - /tmp
      - /app/frontend/.next/cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${NOCSOC_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m

  # ------------------------------------------------------------------ P2: stream + analytics
  redpanda:
    <<: *hardening
    profiles: [stream]
    networks: [bus]
    # Redpanda v25.2.9 (Kafka API). Dev mode, single node, plaintext on the internal network;
    # the host listener binds to 127.0.0.1 only. SASL/TLS arrive with the hardened profile (P7).
    image: redpandadata/redpanda@sha256:bd6c35647153a4dbc19507c8037dcca0802484c23e6e5fbb97591a62539e313a
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${NOCSOC_KAFKA_PORT:-19092}
    # Topics are created explicitly by migrate-stream; producers only write to known topics.
    # (dev-container mode leaves auto-create on; disabling it is part of the P7 hardened profile.)
    volumes:
      - redpandadata:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:${NOCSOC_KAFKA_PORT:-19092}:19092"
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 900m

  clickhouse:
    <<: *hardening
    profiles: [stream, analytics]
    networks: [data]
    # ClickHouse 25.8 LTS. The bootstrap admin creates the ingest/reader users and row policies
    # (app.db.migrate_stream); the API only ever connects as nocsoc_reader.
    image: clickhouse/clickhouse-server@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    environment:
      CLICKHOUSE_USER: nocsoc_admin
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_admin_password
      CLICKHOUSE_DB: nocsoc
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets: [clickhouse_admin_password]
    volumes:
      - clickhousedata:/var/lib/clickhouse
      # Backups (P7, scripts/backup.py): native BACKUP may write only under
      # /var/lib/clickhouse/backups (inside the data volume, owned by the server user).
      - ./clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
    ports:
      - "127.0.0.1:${NOCSOC_CLICKHOUSE_PORT:-8123}:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user nocsoc_admin --password \"$$(cat /run/secrets/clickhouse_admin_password)\" -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1500m

  # One-shot: topics, ClickHouse tables, users and row policies (app.db.migrate_stream).
  migrate-stream:
    <<: *hardening
    restart: "no"
    profiles: [stream]
    networks: [data, bus]
    image: nocsoc/api:dev
    command: ["python", "-m", "app.db.migrate_stream"]
    environment:
      NOCSOC_KAFKA_BOOTSTRAP: redpanda:9092
      NOCSOC_CLICKHOUSE_HOST: clickhouse
    secrets:
      - source: clickhouse_admin_password
        target: nocsoc_clickhouse_admin_password
      - source: clickhouse_ingest_password
        target: nocsoc_clickhouse_ingest_password
      - source: clickhouse_reader_password
        target: nocsoc_clickhouse_reader_password
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      redpanda: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m

  ingest-worker:
    <<: *hardening
    profiles: [stream]
    networks: [data, bus, search, telemetry]
    image: nocsoc/api:dev
    command: ["python", "-m", "app.workers.ingest"]
    environment:
      NOCSOC_DATABASE_HOST: postgres
      NOCSOC_KAFKA_BOOTSTRAP: redpanda:9092
      NOCSOC_CLICKHOUSE_HOST: clickhouse
      NOCSOC_VALKEY_HOST: valkey
      # Optional (search profile): indexes canonical events and runs the search projection.
      NOCSOC_OPENSEARCH_URL: http://opensearch:9200
      # Per-tenant ingest quota (records/minute); scripts/loadtest.py raises it for a run.
      NOCSOC_TENANT_INGEST_RECORDS_PER_MINUTE: ${NOCSOC_TENANT_INGEST_RECORDS_PER_MINUTE:-6000}
      # Observability profile (P7): OTLP to otel-lgtm when NOCSOC_OTEL_ENABLED=true (scripts/dev sets it).
      NOCSOC_OTEL_ENABLED: ${NOCSOC_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    # Least privilege: the RLS-bound worker role and the INSERT-only ClickHouse user. Valkey
    # carries live-update notifications and per-tenant ingest quotas.
    secrets:
      - source: worker_database_password
        target: nocsoc_worker_database_password
      - source: clickhouse_ingest_password
        target: nocsoc_clickhouse_ingest_password
      - source: valkey_password
        target: nocsoc_valkey_password
      - source: opensearch_indexer_password
        target: nocsoc_opensearch_indexer_password
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      migrate-stream: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      # Search profile only: start after the indexer user exists (no startup projection warnings).
      opensearch-setup: { condition: service_completed_successfully, required: false }
    mem_limit: 384m

  connector-runner:
    <<: *hardening
    profiles: [stream]
    networks: [bus]
    build:
      context: ../..
      dockerfile: infrastructure/docker/runner.Dockerfile
      secrets: [build_extra_ca]
    image: nocsoc/runner:dev
    environment:
      NOCSOC_API_URL: http://api:8000
      NOCSOC_KAFKA_BOOTSTRAP: redpanda:9092
    # Only the runner token: no database or ClickHouse credentials (sandbox connectors only).
    secrets:
      - source: runner_token
        target: nocsoc_runner_token
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }
      migrate-stream: { condition: service_completed_successfully }
    mem_limit: 256m

secrets:
  # Build-time only: extra root CA for TLS-inspecting antivirus/proxies (see infrastructure/certs).
  build_extra_ca:
    file: ../certs/extra-ca.pem
  postgres_password:
    file: ../secrets/postgres_password
  database_password:
    file: ../secrets/database_password
  auth_database_password:
    file: ../secrets/auth_database_password
  master_key:
    file: ../secrets/master_key
  valkey_password:
    file: ../secrets/valkey_password
  worker_database_password:
    file: ../secrets/worker_database_password
  runner_token:
    file: ../secrets/runner_token
  clickhouse_admin_password:
    file: ../secrets/clickhouse_admin_password
  clickhouse_ingest_password:
    file: ../secrets/clickhouse_ingest_password
  clickhouse_reader_password:
    file: ../secrets/clickhouse_reader_password
  ai_gateway_token:
    file: ../secrets/ai_gateway_token
  workflow_token:
    file: ../secrets/workflow_token
  opensearch_admin_password:
    file: ../secrets/opensearch_admin_password
  opensearch_reader_password:
    file: ../secrets/opensearch_reader_password
  opensearch_indexer_password:
    file: ../secrets/opensearch_indexer_password
  audit_anchor_key:
    file: ../secrets/audit_anchor_key
  grafana_admin_password:
    file: ../secrets/grafana_admin_password
  oidc_client_secret:
    file: ../secrets/oidc_client_secret
  sso_demo_password:
    file: ../secrets/sso_demo_password
  keycloak_admin_password:
    file: ../secrets/keycloak_admin_password

# Segmentation (threat model T13, SEC-CON-02): the connector runner reaches only the API and
# the event bus. Data stores sit on `data`, which the runner is not attached to.
# The AI gateway reaches only the API, over `ai`, which is internal (no internet). Enabling a
# cloud model needs a deliberate override that gives the gateway an egress network
# (docs/reports/P4-exit-review.md), on top of the gateway and tenant opt-in settings.
networks:
  data:
  bus:
  frontend:
  ai:
    internal: true
  # Temporal, the workflow worker and the API. The worker has no route to the data stores.
  workflow:
    internal: true
  # OpenSearch, its setup job, the API (reader) and the ingest worker (indexer).
  search:
    internal: true
  # OTLP from the platform services to otel-lgtm (observability profile). No internet.
  telemetry:
    internal: true

volumes:
  # Audit anchors: back this up separately from the database (scripts/backup copies it).
  auditanchors:
  osdata:
  lgtmdata:
  temporaldata:
  pgdata:
  redpandadata:
  clickhousedata:
