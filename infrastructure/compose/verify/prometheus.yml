# P8 live verification target (ADR-0019): real Prometheus 3.7, scraping itself and Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager-demo:9093"]}]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager-demo:9093"]}]
