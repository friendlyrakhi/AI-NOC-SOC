# gitleaks configuration: default rules plus project path exclusions.
title = "ai-noc-soc"

[extend]
useDefault = true

[allowlist]
description = "Generated, vendored or git-ignored local paths"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.next/''',
  '''(^|/)\.git/''',
  '''(^|/)(\.mypy_cache|\.ruff_cache|\.pytest_cache|__pycache__)/''',
  # git-ignored local secrets (generated by bootstrap/seed); history + staged scans cover commits
  '''(^|/)infrastructure/secrets/[a-z_-]+(\.json)?$''',
  '''(^|/)infrastructure/certs/[^/]+\.pem$''',
  '''(^|/)(test-results|playwright-report)/''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)uv\.lock$''',
]
